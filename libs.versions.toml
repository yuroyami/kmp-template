# The Kotlin and Compose versions are module settings (see common.module-template.yaml and
# compose.module-template.yaml), so they are not in this file.

[versions]
## Libraries that ship with Compose Multiplatform. Keep them on the versions in the Libraries table of its release notes.
compose-material3 = "1.13.0-beta01"
navigation3-ui = "1.2.0"
navigation3-runtime = "1.2.0"
lifecycle = "2.11.0"

## Kotlin
coroutines = "1.11.0"

## Settings and logging
datastore = "1.3.0"
kermit = "2.2.0"

## Android
activity-compose = "1.14.0-alpha03"
core-splashscreen = "1.2.0"


[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
# JetBrains publishes the UI. androidx publishes the runtime. Each has its own version in the Navigation3 row of the Libraries table.
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3-ui" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3-runtime" }
# This artifact follows the Lifecycle row of the Libraries table, although its name contains navigation3.
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# The -core artifact holds PreferenceDataStoreFactory, which Prefs.kt calls on every platform.
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
